<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Status</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #f5f5f5;
            color: #333;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }
        .mobile-container {
            max-width: 420px;
            min-height: 100vh;
            margin: 0 auto;
            background: #f9f9f9;
            box-shadow: 0 0 30px rgba(0, 0, 0, .1);
        }
        .header {
            min-height: 60px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            border-bottom: 1px solid #e8e8e8;
        }
        .header-left, .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-logo {
            color: #002964;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: .5px;
        }
        .header-logo-image {
            width: 20px;
            height: 20px;
            display: block;
            object-fit: contain;
            border-radius: 2px;
        }
        .header-icon {
            color: #333;
            font-size: 20px;
            line-height: 1;
        }
        .main-content {
            min-height: calc(100vh - 60px);
            padding: 28px 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }
        .suspended-card {
            width: 100%;
            padding: 36px 24px;
            text-align: center;
            background: #fff;
            border: 1px solid #ececec;
            border-radius: 18px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, .09);
        }
        .status-icon {
            width: 76px;
            height: 76px;
            margin: 0 auto 22px;
            display: grid;
            place-items: center;
            color: #c41e3a;
            background: #fff0f2;
            border-radius: 50%;
            font-size: 38px;
            font-weight: 700;
        }
        h1 {
            margin: 0 0 12px;
            color: #252525;
            font-size: 27px;
            line-height: 1.2;
        }
        .status-label {
            display: inline-block;
            margin-bottom: 18px;
            padding: 7px 14px;
            color: #a71931;
            background: #fff0f2;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
        }
        .message {
            margin: 0;
            color: #666;
            font-size: 15px;
            line-height: 1.6;
        }
        .logout-button {
            width: 100%;
            max-width: 384px;
            padding: 14px 18px;
            color: #fff;
            background: #c41e3a;
            border: 0;
            border-radius: 8px;
            font: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }
        .logout-button:hover { background: #a71931; }
        .logout-button:focus-visible { outline: 3px solid #7f1425; outline-offset: 3px; }
        @media (max-width: 420px) {
            .mobile-container { box-shadow: none; }
        }
    </style>
</head>
<body>
    <div class="mobile-container">
        <header class="header" aria-label="Bank header">
            <div class="header-left" aria-hidden="true">
                <span class="header-icon">☰</span>
                <img
                    class="header-logo-image"
                    src="https://i.ibb.co/dJpRtmtW/IMG-4194.jpg"
                    alt=""
                >
                <span class="header-logo">Bank Of America</span>
            </div>
            <div class="header-right" aria-hidden="true">
                <span class="header-icon">✉</span>
                <span class="header-icon">♙</span>
                <span class="header-icon">⋮</span>
            </div>
        </header>
        <main class="main-content">
            <section class="suspended-card" aria-labelledby="status-title">
                <div class="status-icon" aria-hidden="true">!</div>
                <div class="status-label">ACCOUNT STATUS</div>
                <h1 id="status-title">Account suspended</h1>
                <p class="message">Access to this account is currently suspended.</p>
            </section>
            <button class="logout-button" type="button" onclick="logout()">Log out</button>
        </main>
    </div>
    <script>
        function logout() {
            sessionStorage.clear();
            localStorage.clear();
            window.location.assign("login.html");
        }
    </script>
</body>
</html>
